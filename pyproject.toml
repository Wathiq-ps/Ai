[project]
name = "wathiq-ai"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.3.1",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
# ponytail: enumerated, not extend-select -- RUF100 (dead-noqa detection) only fires
# under `select` in ruff 0.16. Defaults (E4,E7,E9,F) + import order (I) + py312
# rewrites (UP) + bugbear (B). Add more rule sets only when a real bug slips through.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF100"]
